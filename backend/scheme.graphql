type Todo {
  id: ID!
  title: String!
  status: TodoStatus!
  priority: Priority!
  dueDate: String
  tags: [String]
  comments: [Comment]
  checklistItems: [ChecklistItem]
  history: [HistoryEntry]
  createdAt: String!
  updatedAt: String!
  attachments: [Attachment]
  ownerId: ID
  collaborators: [ID]
  moderators: [ID]
  isPublic: Boolean
}

type Comment {
  id: ID!
  text: String!
  author: String
  createdAt: String!
}

type ChecklistItem {
  id: ID!
  label: String!
  description: String
  checked: Boolean!
}

type HistoryEntry {
  changedAt: String!
  field: String!
  oldValue: String
  newValue: String
}

type Attachment {
  id: ID!
  filename: String!
  originalname: String!
  url: String!
  uploadedAt: String!
}

enum TodoStatus {
  OPEN
  IN_PROGRESS
  DONE
}

enum Priority {
  LOW
  MEDIUM
  HIGH
}

enum Role {
  user
  moderator
  admin
}

type User {
  id: ID!
  email: String!
  displayName: String
  avatarUrl: String
  role: Role!
}

type Query {
  todos(status: TodoStatus, tag: String, priority: Priority): [Todo!]!
  todo(id: ID!): Todo
  me: User
  users: [User!]!
}

type Mutation {
  createTodo(input: CreateTodoInput!): Todo!
  updateTodo(id: ID!, input: UpdateTodoInput!): Todo!
  deleteTodo(id: ID!): Boolean!
  addComment(todoId: ID!, text: String!, author: String): Todo!
  addChecklistItem(todoId: ID!, label: String!, description: String): Todo!
  updateChecklistItem(
    todoId: ID!
    itemId: ID!
    label: String
    description: String
    checked: Boolean
  ): Todo!
  deleteChecklistItem(todoId: ID!, itemId: ID!): Todo!
  addAttachment(
    todoId: ID!
    filename: String!
    originalname: String!
    url: String!
  ): Todo!
  deleteAttachment(todoId: ID!, attachmentId: ID!): Todo!
  deleteComment(todoId: ID!, commentId: ID!): Todo!
  addCollaborator(todoId: ID!, userId: ID!): Todo!
  removeCollaborator(todoId: ID!, userId: ID!): Todo!
  addTodoModerator(todoId: ID!, userId: ID!): Todo!
  removeTodoModerator(todoId: ID!, userId: ID!): Todo!
  setUserRole(userId: ID!, role: Role!): User!
}

type Subscription {
  todoCreated: Todo!
  todoUpdated: Todo!
  todoDeleted: ID!
}

input CreateTodoInput {
  title: String!
  priority: Priority
  dueDate: String
  tags: [String]
  isPublic: Boolean
}

input UpdateTodoInput {
  title: String
  status: TodoStatus
  priority: Priority
  dueDate: String
  tags: [String]
  isPublic: Boolean
}
